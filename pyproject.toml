[project]
name = "agent-demo"
version = "0.1.0"
description = "A statistical analysis agent built with Microsoft Agent Framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-openai~=1.10.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
